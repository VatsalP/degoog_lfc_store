<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Liverpool Matches Degoog slot preview</title>
  <desc id="desc">Preview of a Liverpool live score card above search results</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17191d"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="live" x1="220" y1="235" x2="980" y2="470" gradientUnits="userSpaceOnUse">
