      <g transform="translate(35 29)" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle r="15"/>
        <path d="m-4-3 4-4 4 4-2 5h-4Z"/>
        <path d="m-11-10 7 7M11-10 4-3M-15 4l13-2M15 4 2 8"/>
