  </defs>
  <rect width="1200" height="675" fill="url(#page)"/>
  <circle cx="1070" cy="85" r="220" fill="#c8102e" opacity=".08"/>
  <circle cx="120" cy="620" r="260" fill="#c8102e" opacity=".06"/>
